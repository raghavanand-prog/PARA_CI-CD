# AWS CodeBuild buildspec — the ONLY place in this pipeline where the
# security gate is enforced (see terraform/modules/codepipeline: there is
# deliberately no manual "Approve" stage in CodePipeline). If `security-
# gate.sh` exits non-zero, the `build` phase command fails, CodeBuild marks
# the build FAILED, CodePipeline stops before Deploy, and the ECS service is
# never touched.
#
# Required CodeBuild project environment variables (set by
# terraform/modules/codebuild): ECR_REPOSITORY_URL, ECR_REPOSITORY_NAME,
# AWS_REGION_NAME.

version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "== install: tool versions =="
      - node --version
      - npm --version
      - docker --version
      - echo "== install: app dependencies =="
      - cd app && npm ci && cd -
      - echo "== install: security scanners (best-effort; scripts fail loudly, not silently, if a tool is missing) =="
      - pip install --quiet semgrep checkov || echo "WARNING: pip install of semgrep/checkov failed; run-sast.sh/run-iac-scan.sh will report tool_missing"
      - (curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | sh -s -- -b /usr/local/bin) || echo "WARNING: gitleaks install failed"
      - (curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin) || echo "WARNING: trivy install failed"
      - (curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin) || echo "WARNING: syft install failed"

  pre_build:
    commands:
      - echo "== pre_build: lint =="
      - cd app && npm run lint && cd -
      - echo "== pre_build: unit tests =="
      - cd app && npm test && cd -
      - echo "== pre_build: ECR login =="
      - bash ci/scripts/ecr-login.sh
      - export LOCAL_IMAGE="${ECR_REPOSITORY_NAME}:build-${CODEBUILD_BUILD_NUMBER:-local}"
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"

  build:
    commands:
      - echo "== build: docker image =="
      - docker build -t "$LOCAL_IMAGE" ./app

      - echo "== build: SAST (Semgrep) =="
      - bash security/scripts/run-sast.sh app/src || SAST_EXIT=$?

      - echo "== build: dependency scan (npm audit / OWASP Dependency-Check) =="
      - bash security/scripts/run-dependency-scan.sh app || DEP_EXIT=$?

      - echo "== build: secret scan (Gitleaks) =="
      - bash security/scripts/run-secret-scan.sh || SECRET_EXIT=$?

      - echo "== build: IaC scan (Checkov against terraform/) =="
      - bash security/scripts/run-iac-scan.sh terraform || IAC_EXIT=$?

      - echo "== build: container scan (Trivy) =="
      - bash security/scripts/run-container-scan.sh "$LOCAL_IMAGE" || CONTAINER_EXIT=$?

      - echo "== build: SBOM generation (best-effort, non-blocking) =="
      - bash ci/scripts/generate-sbom.sh "$LOCAL_IMAGE" sbom || true

      - echo "== build: SECURITY GATE =="
      - echo "Individual scan exit codes -> sast=${SAST_EXIT:-0} deps=${DEP_EXIT:-0} secrets=${SECRET_EXIT:-0} iac=${IAC_EXIT:-0} container=${CONTAINER_EXIT:-0}"
      - echo "(non-zero above just means that scanner reported findings or could not run; the GATE below is the actual pass/fail decision, made from the normalized reports, not from these exit codes)"
      - bash security/scripts/security-gate.sh
      - echo "SECURITY GATE PASSED — proceeding to push the image"

      - echo "== build: push to ECR (only reached if the gate passed) =="
      - export ECR_REPOSITORY_URL="$ECR_REPOSITORY_URL"
      - export LOCAL_IMAGE="$LOCAL_IMAGE"
      - export IMAGE_TAG="$IMAGE_TAG"
      - bash ci/scripts/push-image.sh

  post_build:
    commands:
      - echo "== post_build: summary =="
      - cat security/reports/summary/security-gate-summary.txt || true

# Only imagedefinitions.json is emitted as the pipeline artifact — that is
# the one file CodePipeline's ECS deploy action consumes. The full set of
# scan reports and the gate's PASS/FAIL summary are printed in post_build
# (captured in the CodeBuild CloudWatch log group either way) rather than
# published as a second artifact, to keep this buildspec's single Build
# action compatible with the single-output-artifact CodePipeline stage
# defined in terraform/modules/codepipeline.
artifacts:
  files:
    - imagedefinitions.json
