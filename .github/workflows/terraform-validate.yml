name: Terraform Validate

# Static correctness checks for the Terraform IaC — formatting and internal
# validity (types, references, required arguments). This does NOT run
# `terraform plan`/`apply` (no AWS credentials are configured for this
# workflow on purpose) — that happens from a human's or CodeBuild's own
# `terraform apply` against real AWS credentials, per docs/deployment.md.

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        working-directory:
          - terraform
          - terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        working-directory: ${{ matrix.working-directory }}
        run: terraform fmt -recursive -check

      - name: terraform init (no backend, no credentials required)
        working-directory: ${{ matrix.working-directory }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.working-directory }}
        run: terraform validate
